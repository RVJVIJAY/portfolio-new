<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vijay R — Frontend Developer building scalable, responsive web applications with React.js, TypeScript and Redux Toolkit." />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <title>Vijay R — Frontend Developer</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Vijay R — Frontend Developer" />
    <meta
      property="og:description"
      content="Frontend Developer with 2+ years of experience building healthcare and wellness platforms with React.js and TypeScript."
    />
    <script>
      /* Apply the stored accent before the first paint, so the page never shows
         the default indigo and then flips. Mirrors getInitialAccent() in
         src/hooks/useAccent.ts — keep the two in step. */
      (function () {
        var allowed = ['indigo', 'violet', 'cyan', 'emerald', 'amber', 'rose'];
        var root = document.documentElement;
        var accent = 'indigo';

        try {
          var stored = localStorage.getItem('portfolio-accent');

          if (allowed.indexOf(stored) > -1) {
            accent = stored;
          } else if (stored === 'custom') {
            /* useAccent() caches the eight derived variables alongside the hex,
               so this only replays them — no colour maths is duplicated here. */
            var entry = JSON.parse(localStorage.getItem('portfolio-accent-custom'));
            if (entry && entry.vars) {
              for (var name in entry.vars) {
                if (Object.prototype.hasOwnProperty.call(entry.vars, name)) {
                  root.style.setProperty(name, entry.vars[name]);
                }
              }
              accent = 'custom';
            }
          }
        } catch (error) {
          /* Blocked storage or a corrupt entry — fall through to the default. */
        }

        root.dataset.accent = accent;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
